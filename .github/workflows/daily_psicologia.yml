name: Publicar Video Diario - Código Mental

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  publicar-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Bot v2.2 (1 Largo + 2 Shorts, fallback 4 niveles)
      env:
        # ─── API Keys ───
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DEEPSEEK_MODEL: "deepseek-chat"

        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # ← fallback nivel 3

        YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}

        # ─── Horarios ───
        HORA_LARGO: 8
        VARIACION_MINUTOS_LARGO: 30
        HORA_SHORT_1: 10
        VARIACION_MINUTOS_SHORT_1: 45
        HORA_SHORT_2: 15
        VARIACION_MINUTOS_SHORT_2: 60

        # ─── Banderas ───
        GENERAR_SHORT: "true"
        PROGRAMAR_PICO: "true"
        INTERVALO_MIN_HORAS: "24"

      run: python bt_yt_psico.py
